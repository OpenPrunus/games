name: CI

# CI sur le Gitea interne (git.prunus.dev, runner LXC 111). GitHub n'est qu'une sauvegarde : pas de CI là-bas.
on:
  push:
    branches: [main]
    # Jamais sur une étiquette (Gitea lancerait sinon la CI de chaque étiquette poussée)
    tags-ignore: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  page:
    name: Page tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test

  docker:
    name: Docker image (smoke test)
    runs-on: ubuntu-latest
    env:
      # Démon Docker partagé de l'hôte : noms uniques, réseau de la tâche partagé (pas de port publié)
      IMAGE: games:ci-${{ github.run_id }}
      NAME: games-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t "$IMAGE" .
      - name: Serve and check the page, its assets and the security headers
        run: |
          set -eu
          docker run -d --name "$NAME" --network "container:$(hostname)" "$IMAGE"
          for i in $(seq 1 20); do curl -fs http://localhost/ >/dev/null && break; sleep 1; done
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code http://localhost/)" = 200
          for f in css/style.css js/main.js favicon.svg assets/hillshot.webp assets/gloop-volley.webp assets/chicken-challenge.webp assets/og.png; do test "$(code http://localhost/$f)" = 200; done
          for f in Dockerfile nginx.conf docker-compose.yml tests/page.test.js .git/config; do test "$(code http://localhost/$f)" = 404; done
          curl -sI http://localhost/ | grep -qi "content-security-policy"
          curl -sI http://localhost/ | grep -qi "x-content-type-options: nosniff"
      - name: Container logs
        if: failure()
        run: docker logs "$NAME"
      - name: Nettoyage
        if: always()
        run: docker rm -f "$NAME" >/dev/null 2>&1 || true; docker rmi -f "$IMAGE" >/dev/null 2>&1 || true
