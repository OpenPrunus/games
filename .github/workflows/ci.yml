name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  page:
    name: Page tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test

  docker:
    name: Docker image (smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t games:ci .
      - name: Serve and check the page, its assets and the security headers
        run: |
          set -eu
          docker run -d --name games -p 8080:80 games:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8080/ >/dev/null && break; sleep 1; done
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code http://localhost:8080/)" = 200
          for f in css/style.css js/main.js favicon.svg assets/hillshot.webp assets/gloop-volley.webp assets/chicken-challenge.webp assets/og.png; do test "$(code http://localhost:8080/$f)" = 200; done
          for f in Dockerfile nginx.conf docker-compose.yml tests/page.test.js .git/config; do test "$(code http://localhost:8080/$f)" = 404; done
          curl -sI http://localhost:8080/ | grep -qi "content-security-policy"
          curl -sI http://localhost:8080/ | grep -qi "x-content-type-options: nosniff"
      - name: Container logs
        if: failure()
        run: docker logs games
